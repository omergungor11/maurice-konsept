<style>
/* ---- the album as a toy version of a Pro Tools edit window. Thick ink, chunky, presses back. ---- */
.daw-lede{max-width:min(44rem,40vw);margin-bottom:clamp(1.6rem,4vh,2.6rem);}
/* the bar PA: two long boxes on one bar, hung from the line under the menu as
   if it were the ceiling; the left box pumps to the left channel, the right
   box to the right */
.pa{position:absolute;right:calc(var(--pad) + 1vw);top:0;width:clamp(18rem,48vw,42rem);pointer-events:none;transform-origin:50% 0;will-change:transform;}
.pa__img{display:block;width:100%;height:auto;}
.spk__cone{position:absolute;height:auto;transform-origin:50% 50%;will-change:transform;}
@media (max-width:760px){
  .pa{width:13.5rem;right:.9rem;}
  .daw-lede{max-width:none;}
}}}}
.daw-lede a{color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.16em;}
/* until someone touches it, the machine asks: the clock blinks PRESS PLAY and the play key throbs */
.daw__win.idle .daw__time{animation:lcd 1.1s steps(1) infinite;}
@keyframes lcd{50%{opacity:.25;}}
.daw__win.idle .key--play{animation:throb 1.1s ease-in-out infinite;}
@keyframes throb{50%{background:#8af59a;box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(85,209,106,.35);}}
@media (prefers-reduced-motion:reduce){.daw__win.idle .daw__time,.daw__win.idle .key--play{animation:none;}}
.daw{margin:0;position:relative;--o:2.5px solid var(--ink);--win:#3b3b41;--lane:#2d2d32;--well:#141416;}
.daw__win{border:var(--o);border-radius:16px;background:var(--win);color:#eee;position:relative;overflow:hidden;
  box-shadow:8px 8px 0 var(--ink);user-select:none;-webkit-user-select:none;}
.daw__bar{display:flex;align-items:center;gap:8px;height:2.6rem;padding:0 1rem;background:#2a2a2e;border-bottom:var(--o);position:relative;}
.daw__bar i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#ff5f57;flex:none;}
.daw__bar i:nth-child(2){background:#febc2e;}.daw__bar i:nth-child(3){background:#28c840;}
.daw__file{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;font-size:.84rem;letter-spacing:.02em;white-space:nowrap;}

/* top: big keys, clock, meters */
.daw__top{display:flex;align-items:center;gap:1.2rem;padding:1rem;border-bottom:var(--o);flex-wrap:wrap;}
.daw__transport{display:flex;gap:.5rem;}
.key{width:3.3rem;height:3.1rem;border:var(--o);border-radius:10px;background:#d9d9de;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 4px 0 var(--ink);transform:translateY(0);transition:transform .06s,box-shadow .06s;}
.key svg{width:1.15rem;height:1.15rem;}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 0 0 var(--ink);}
.key--play{background:#55d16a;width:4.4rem;}
.key--play.on{background:#8af59a;transform:translateY(4px);box-shadow:0 0 0 var(--ink);}
.key--rec{background:#ff5a4e;color:#fff;}
.key:focus-visible{outline:3px solid #febc2e;outline-offset:2px;}
.daw__clock{background:var(--well);border:var(--o);border-radius:12px;padding:.45rem 1rem;display:flex;align-items:center;gap:.9rem;box-shadow:inset 0 3px 0 rgba(0,0,0,.6);}
.daw__time{font-family:var(--mono);font-weight:700;font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1;color:#8ff0a1;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(143,240,161,.35);}
.daw__clock small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#9a9aa2;line-height:1.5;}
.daw__clock small b{color:#eee;font-weight:700;}
.daw__meters{margin-left:auto;display:flex;gap:1.1rem;align-items:center;}
.meter{display:flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.12em;}
.meter__blocks{display:flex;gap:3px;padding:3px;border:var(--o);border-radius:6px;background:var(--well);}
.meter__blocks u{width:7px;height:16px;border-radius:2px;background:#2b2b30;text-decoration:none;}
.meter__blocks u.g{background:#55d16a;}.meter__blocks u.y{background:#febc2e;}.meter__blocks u.r{background:#ff5a4e;}

.trk{display:grid;grid-template-columns:var(--hd,13.5rem) minmax(0,1fr);}

/* tracks */
#daw-tracks{background:var(--lane);padding:.35rem 0;}
.trk{height:var(--th,5.2rem);cursor:pointer;}
.trk__hd{padding:.45rem .7rem;display:flex;align-items:center;border-right:var(--o);}
.trk__tag{width:100%;background:var(--c);color:var(--ink);border:var(--o);border-radius:10px;padding:.4rem .6rem;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;}
.trk__name{display:block;font-weight:800;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trk__sub{display:block;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.08em;opacity:.75;}
.trk__lane{position:relative;padding:.45rem .9rem .45rem .7rem;}
.clip{position:absolute;top:.45rem;bottom:.45rem;left:.7rem;border:var(--o);border-radius:12px;background:var(--c);overflow:hidden;
  box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;}
.clip__name{font-family:var(--mono);font-size:.6rem;font-weight:700;color:var(--ink);padding:.15rem .5rem;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;}
.clip canvas{display:block;width:100%;flex:1;min-height:0;}
@media (hover:hover){
  .trk:not(.off):hover .clip,.trk:not(.off):hover .trk__tag{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink);}
}
.trk.sel .clip,.trk.sel .trk__tag{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink);}
.trk.sel .trk__tag::after{content:"\25B6  playing";display:block;font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:.1rem;}
.trk.sel.paused .trk__tag::after{content:"\2759\2759  paused";}
.trk.sel .trk__sub{display:none;}
.daw__head{position:absolute;top:.1rem;bottom:.1rem;width:3px;margin-left:-1.5px;background:var(--ink);pointer-events:none;display:none;z-index:2;border-radius:2px;}
.daw__head::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid var(--ink);border-bottom:0;}
.trk.sel .daw__head{display:block;}
.trk.off{cursor:pointer;}
.trk.off .trk__tag{background:#5a5a62;color:#c8c8cf;border-style:dashed;box-shadow:none;}
.trk.off .clip{background:#4a4a52;border-style:dashed;box-shadow:none;}
.trk.off .clip__name{color:#c8c8cf;border-bottom-style:dashed;background:transparent;}
.trk.off.shake .clip{animation:shake .4s;}
@keyframes shake{20%{transform:translateX(-4px) rotate(-2deg);}40%{transform:translateX(4px) rotate(2deg);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}

/* the alert */
.daw__alert{position:absolute;left:50%;top:50%;width:min(26rem,90%);background:#fff;color:var(--ink);border:var(--o);border-radius:14px;box-shadow:8px 8px 0 var(--ink);
  display:none;z-index:5;padding:1.2rem;transform:translate(-50%,-50%) rotate(-1.5deg);}
.daw__alert.show{display:grid;grid-template-columns:3rem 1fr;column-gap:.9rem;animation:pop .22s cubic-bezier(.3,1.6,.6,1);}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-1.5deg) scale(.6);opacity:0;}}
.daw__alert svg{width:3rem;height:3rem;}
.daw__alert p{font-size:1rem;line-height:1.35;font-weight:600;}
.daw__alert small{display:block;font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);margin-top:.35rem;}
.daw__alert div{grid-column:1 / -1;display:flex;justify-content:flex-end;margin-top:1rem;}
.daw__alert button{font-family:var(--mono);font-size:.75rem;font-weight:700;letter-spacing:.14em;border:var(--o);border-radius:8px;background:#5b8def;color:#fff;padding:.5rem 1.6rem;cursor:pointer;box-shadow:0 3px 0 var(--ink);}
.daw__alert button{transition:transform .08s,box-shadow .08s,background .08s;}
@media (hover:hover){
  .daw__alert button:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink);background:#7aa3f5;}
  .key:not(.on):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);filter:brightness(1.08);}
}
.daw__alert button:active{transform:translateY(3px);box-shadow:none;}
.key:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important;}

@media (max-width:760px){
  .daw{--hd:6.6rem;--th:4.2rem;}
  .daw__win{border-radius:12px;box-shadow:5px 5px 0 var(--ink);}
  .daw__file{font-size:.72rem;}
  .daw__top{gap:.7rem;padding:.8rem;}
  .daw__clock{order:-1;flex-basis:100%;justify-content:space-between;}
  .daw__transport{flex:1;justify-content:space-between;}
  .key{width:auto;flex:1;height:2.8rem;}
  .daw__meters{display:none;}
  .trk__hd{padding:.35rem .4rem;}
  .trk__tag{padding:.3rem .4rem;border-radius:8px;}
  .trk__name{font-size:.7rem;white-space:normal;line-height:1.05;}
  .trk__sub{font-size:.54rem;}
  .trk__lane{padding-right:.5rem;}
  .clip{left:.4rem;border-radius:9px;}
}
</style>

<script>
/* The demos. Peaks are measured from the audio at build time (RMS, 600
   buckets, two digits each) so the waveforms draw before anything loads;
   the mp3 only downloads when someone presses play. */
(function(){
  "use strict";
  /* TRACKS:start (tools/music_tracks.py writes this) */

    var pr=au.play();if(pr&&pr.catch)pr.catch(function(){playing=false;ui();});
    playing=true;last=performance.now();ui();requestAnimationFrame(tick);}
  function stop(){playing=false;au.pause();ui();if(cur)draw(cur);meters();}
  function tick(now){
    if(!playing)return;
    var dt=(now-last)/1000;clock+=dt;last=now;
    if(au.readyState>0&&pend===null)pos=Math.min(au.currentTime,cur.t.dur);
    draw(cur);ui();meters();requestAnimationFrame(tick);
  }
  rows.forEach(function(R){
    R.el.addEventListener("click",function(e){
      if(R.t.off){R.el.classList.remove("shake");void R.el.offsetWidth;R.el.classList.add("shake");return;}
      var b=R.clip.getBoundingClientRect(),at=0;
      if(e.target.closest(".clip"))at=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*R.t.dur;
      else if(R===cur&&playing){stop();return;}
      select(R,at);play();
    });
  });
  function press(id,fn){var b=document.getElementById(id);b.addEventListener("click",fn);}
  press("daw-play",function(){playing?stop():play();});
  press("daw-stop",function(){if(cur){stop();}});
  press("daw-rw",function(){seek(0);if(cur)draw(cur);ui();});
  press("daw-ff",function(){if(!cur)select(rows[0],0);seek(Math.min(cur.t.dur-.5,pos+10));draw(cur);ui();});
  var alertBox=document.getElementById("daw-alert"),rec=document.getElementById("daw-rec");
  press("daw-rec",function(){if(playing)stop();alertBox.classList.add("show");document.getElementById("daw-ok").focus();});
  press("daw-ok",function(){alertBox.classList.remove("show");rec.focus();});
  document.addEventListener("keydown",function(e){
    if(e.code!=="Space"||/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName))return;
    var b=document.getElementById("daw").getBoundingClientRect();
    if(b.bottom<0||b.top>innerHeight)return;
    e.preventDefault();playing?stop():play();
  });
  window.addEventListener("resize",drawAll);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawAll);
  drawAll();ui();meters();
})();
</script>
